# Runs every test on each push and pull request.
# The result (and the failures, if any) is written as a comment on the PR,
# so it can be read without opening the Actions page.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      composer_update:
        description: "Run composer update and commit composer.lock (upgrades)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # sqlite: fast, like before. mysql: the production database
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexora_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: PHP version from the Dockerfile
        id: php
        run: echo "version=$(grep -oP '^FROM php:\K[0-9]+\.[0-9]+' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.version }}
          extensions: gd, zip, intl, exif, bcmath, pdo_sqlite, sqlite3, pdo_mysql, mbstring, posix
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ steps.php.outputs.version }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-${{ steps.php.outputs.version }}-

      # composer.json changed but composer.lock was not updated (an upgrade
      # branch): make the lock here and commit it back to the branch
      - name: Lock file up to date?
        id: lock
        run: |
          if [ "${{ inputs.composer_update }}" = "true" ] || ! composer validate --no-check-publish --no-check-all --quiet 2>/dev/null; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Composer update (new lock file)
        if: steps.lock.outputs.update == 'true'
        run: composer update --no-interaction --no-progress --prefer-dist -W 2>&1 | tee composer-output.txt

      - name: Composer install
        if: steps.lock.outputs.update != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist 2>&1 | tee composer-output.txt

      - name: Commit the new composer.lock
        if: steps.lock.outputs.update == 'true' && github.event_name != 'push' && matrix.db == 'sqlite'
        run: |
          if ! git diff --quiet composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "composer.lock from CI (composer update)"
            git push
          fi

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Use MySQL
        if: matrix.db == 'mysql'
        run: |
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=nexora_test"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=root"
          } >> "$GITHUB_ENV"

      # The commands a deploy runs: migrations on a real MySQL and the caches
      - name: Migrate and cache like a deploy
        if: matrix.db == 'mysql'
        run: |
          php artisan migrate --force 2>&1 | tail -3
          php artisan config:cache && php artisan route:cache && php artisan view:cache
          php artisan optimize:clear

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          php artisan test --without-tty 2>&1 | sed -r "s/\x1B\[[0-9;]*[A-Za-z]//g" | tee test-output.txt

      - name: Comment the result on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set +e
          touch test-output.txt composer-output.txt
          {
            if [ "$OUTCOME" = "success" ]; then echo "### ✅ Tests passed (${{ matrix.db }})"; else echo "### ❌ Tests failed (${{ matrix.db }})"; fi
            echo
            echo "PHP $(php -r 'echo PHP_VERSION;') · Laravel $(php artisan --version --no-ansi | grep -oP '[0-9.]+$') · commit ${GITHUB_SHA::7}"
            echo
            echo '```'
            grep -E "Tests:|Time:" test-output.txt | tail -2
            echo '```'
            if [ "$OUTCOME" != "success" ]; then
              echo
              echo "<details><summary>Failures</summary>"
              echo
              echo '```'
              # every failed test with its message (cut to fit a comment)
              FAILS=$(grep -A12 -E "^\s+(FAILED|•|⨯)|FAILED " test-output.txt | head -c 50000)
              if [ -n "$FAILS" ]; then echo "$FAILS"; else tail -c 50000 test-output.txt; fi
              echo "--- output: $(wc -l < test-output.txt) lines"
              echo '```'
              echo "</details>"
            fi
            if [ -s composer-output.txt ] && grep -qiE "problem|conflict|could not|requires" composer-output.txt; then
              echo
              echo "<details><summary>Composer</summary>"
              echo
              echo '```'
              tail -c 8000 composer-output.txt
              echo '```'
              echo "</details>"
            fi
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

      - name: Fail the job when tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1

  # The production image builds (PHP version, extensions, composer install)
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Build the image
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          docker build --pull --progress=plain -t nexora-test . 2>&1 | sed -r "s/\x1B\[[0-9;]*[A-Za-z]//g" | tail -25 | tee docker-output.txt
          docker run --rm --entrypoint php nexora-test -v | head -1 | tee -a docker-output.txt
      - name: Comment the result on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          set +e
          {
            if [ "$OUTCOME" = "success" ]; then echo "### ✅ Docker image builds"; else echo "### ❌ Docker image does not build"; fi
            echo
            echo '```'
            tail -c 6000 docker-output.txt
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
      - name: Fail the job when the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
